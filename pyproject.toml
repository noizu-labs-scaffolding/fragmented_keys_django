[project]
name = "fragmented-keys-django"
version = "0.1.1"
description = "Django cache management with fragmented keys for better invalidation support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django==5.0.3",
    "django-redis==6.0.0",
    "fragmented-keys>=0.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools]
packages = ["fragmented_keys_django"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
